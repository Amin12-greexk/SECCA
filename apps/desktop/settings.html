<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SECCA - Pengaturan Server</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #475569;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      input, select {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 10px;
        border: 1px solid #cbd5f5;
        background: #fff;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        background: #0f766e;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #0f172a;
      }
      .error {
        background: #fee2e2;
        color: #b91c1c;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
      }
      .success {
        background: #dcfce7;
        color: #166534;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
      }
      .section {
        border-top: 1px solid #e2e8f0;
        padding-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Pengaturan Server SECCA</h1>
        <p>Masukkan alamat server frontend (contoh: http://192.168.11.246:3000).</p>
      </div>

      <div>
        <label for="serverUrl">Server URL</label>
        <input id="serverUrl" placeholder="http://192.168.11.246:3000" />
      </div>

      <div id="error" class="error"></div>
      <div id="success" class="success">Berhasil disimpan. Aplikasi akan memuat ulang.</div>

      <div class="actions">
        <button class="secondary" id="reload">Reload</button>
        <button id="save">Simpan</button>
      </div>
    </div>

    <script>
      const serverInput = document.getElementById('serverUrl');
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const saveBtn = document.getElementById('save');
      const reloadBtn = document.getElementById('reload');

      // Check if seccaDesktop is available (preload script loaded correctly)
      if (!window.seccaDesktop) {
        document.body.innerHTML = `
          <div class="container">
            <div class="error" style="display:block;">
              <strong>Error:</strong> Desktop API tidak tersedia. 
              Preload script mungkin gagal dimuat. 
              Silakan restart aplikasi atau periksa log.
            </div>
          </div>
        `;
        throw new Error('seccaDesktop not available');
      }

      const showError = (message) => {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
      };

      const showSuccess = () => {
        successEl.style.display = 'block';
        errorEl.style.display = 'none';
      };

      const loadConfig = async () => {
        try {
          const config = await window.seccaDesktop.getConfig();
          serverInput.value = config?.serverUrl ?? '';
        } catch (error) {
          showError('Gagal memuat konfigurasi: ' + (error?.message || 'Unknown error'));
        }
      };

      saveBtn.addEventListener('click', async () => {
        try {
          await window.seccaDesktop.saveConfig({
            serverUrl: serverInput.value,
          });
          showSuccess();
        } catch (error) {
          showError(error?.message || 'Gagal menyimpan konfigurasi.');
        }
      });

      reloadBtn.addEventListener('click', () => {
        window.location.reload();
      });

      loadConfig();
    </script>
  </body>
</html>
